services:
  - type: web
    name: fillrateretail
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn --bind 0.0.0.0:$PORT wsgi:app"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: SECRET_KEY
        generateValue: true
      - key: IA_API_KEY
        sync: false
      - key: APP_HOST
        value: "0.0.0.0"
      - key: APP_PORT
        value: "10000"
